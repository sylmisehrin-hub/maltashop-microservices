server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/orders {
        proxy_pass http://order-service:5001/orders;
        proxy_set_header Host $host;
    }
    location = /api/order-health {
        proxy_pass http://order-service:5001/health;
    }
    location /api/notifications {
        proxy_pass http://notification-service:5002/notifications;
        proxy_set_header Host $host;
    }
    location = /api/notification-health {
        proxy_pass http://notification-service:5002/health;
    }
}
