services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  order-service:
    build: ./order-service
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: sqlite:////data/orders.db
      RABBITMQ_HOST: rabbitmq
    volumes:
      - order_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  outbox-worker:
    build: ./order-service
    command: python outbox_worker.py
    environment:
      DATABASE_URL: sqlite:////data/orders.db
      RABBITMQ_HOST: rabbitmq
    volumes:
      - order_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: sqlite:////data/notifications.db
    volumes:
      - notification_data:/data

  notification-worker:
    build: ./notification-service
    command: python worker.py
    environment:
      DATABASE_URL: sqlite:////data/notifications.db
      RABBITMQ_HOST: rabbitmq
    volumes:
      - notification_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - order-service
      - notification-service
    restart: unless-stopped

volumes:
  rabbitmq_data:
  order_data:
  notification_data: